<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Orders — Frontlines Merch</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo-link">
      <img src="images/logo.png" alt="Frontlines" class="logo">
    </a>
    <nav class="main-nav">
      <a href="index.html#shop">Shop</a>
      <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
      <a href="custom.html">Custom Orders</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </div>
</header>

<section class="page-hero">
  <h1>Custom Logos &amp; Shirts</h1>
  <p class="page-hero-sub">Get custom merch made for anything — your business, podcast, team, event, or just something for you.</p>
</section>

<section class="gallery" style="padding-top:0;">
  <h2 style="text-align:center; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:24px;">Past Custom Work</h2>
  <div class="gallery-grid">
    <img src="images/custom-podcast.jpg" alt="Custom podcast logo shirt example" loading="lazy">
    <img src="images/custom-business.jpg" alt="Custom business logo shirt example" loading="lazy">
    <img src="images/custom-recovery.jpg" alt="Custom recovery cause hoodie example" loading="lazy">
    <img src="images/custom-graphic.jpg" alt="Custom graphic design shirt example" loading="lazy">
    <img src="images/custom-metal.jpg" alt="Custom band logo hoodie example" loading="lazy">
  </div>
</section>

<section class="custom-form-section">
  <form action="https://formspree.io/f/meaqynwj" method="POST" enctype="multipart/form-data" class="custom-form">

    <label for="business_name">What's This For? (business, podcast, team, event, personal, etc. — optional)</label>
    <input type="text" id="business_name" name="What's This For">

    <label for="contact_name">Your Name</label>
    <input type="text" id="contact_name" name="Contact Name" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone (optional)</label>
    <input type="tel" id="phone" name="Phone">

    <label for="description">Tell us what you're looking for</label>
    <textarea id="description" name="Description" rows="6" placeholder="What kind of shirts/merch, how many, what colors, any deadlines..." required></textarea>

    <label for="logo">Upload Your Logo (optional)</label>
    <input type="file" id="logo" name="Logo" accept="image/*,.pdf">

    <button type="submit" class="btn">Submit Inquiry</button>
  </form>
</section>

<footer class="site-footer">
  <p>&copy; 2026 Frontlines Merch</p>
</footer>

</body>
</html>
